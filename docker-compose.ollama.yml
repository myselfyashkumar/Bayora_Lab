# Optional: real small model instead of the stub.
# Prepare once, with internet:   see Step 6 of the build plan.
# Run:  docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build

volumes:
  bayora_ollama: { external: true }

services:
  llm:
    image: ollama/ollama
    networks: [model_net]          # internal: the model has no internet
    volumes: ["bayora_ollama:/root/.ollama"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0

  model:
    environment:
      OLLAMA_URL: http://llm:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    depends_on: [llm]

  gateway:
    environment:
      REPLY_DEADLINE_S: "15.0"     # set above the slowest real reply you measure
